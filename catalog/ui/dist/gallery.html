<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioCartoon illustrations</title>
<style>
:root{color-scheme:light dark;
  --bg:#f6f6f4;--panel:#ffffff;--card:#ffffff;--well:#f1f1ee;--ink:#18181b;--muted:#5f6368;--line:#e2e2de;--field:#ffffff;--field-line:#d6d6d1;
  --orange:#FF6C0C;--orange-ink:#1a0d03;--orange-soft:#ffe6d6;--orange-text:#c24d00;--scrim:rgba(24,24,27,.55);--shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);
  font-family:var(--font-sans,Inter,system-ui,-apple-system,"Segoe UI",sans-serif);font-size:14px}
:root[data-theme=dark]{--bg:#0f0f10;--panel:#1c1c1e;--card:#0b0b0c;--well:#f4f4f2;--ink:#f2f2f3;--muted:#a1a1aa;--line:#2e2e32;--field:#26262a;--field-line:#3a3a3f;--orange:#FF6C0C;--orange-ink:#1a0d03;--orange-soft:#3a2010;--orange-text:#ff8a3d;--scrim:rgba(0,0,0,.6);--shadow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0f10;--panel:#1c1c1e;--card:#0b0b0c;--well:#f4f4f2;--ink:#f2f2f3;--muted:#a1a1aa;--line:#2e2e32;--field:#26262a;--field-line:#3a3a3f;--orange:#FF6C0C;--orange-ink:#1a0d03;--orange-soft:#3a2010;--orange-text:#ff8a3d;--scrim:rgba(0,0,0,.6);--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
main{padding:18px 18px 22px;max-width:1100px;margin:auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Header: logo, name, Open BioCartoon */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-size:21px;font-weight:700;letter-spacing:-.4px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--field-line);background:var(--field);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.orange{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.btn.orange:hover{filter:brightness(1.06)}

/* Search row: the editor's search field, then sort, filter, search */
#search{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--field-line);border-radius:12px;padding:0 12px;height:42px;color:var(--muted)}
.field:focus-within{border-color:var(--orange)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:15px;color:var(--ink);height:100%}
.field input::-webkit-search-cancel-button{cursor:pointer}
select{background:var(--field);border:1px solid var(--field-line);border-radius:9px;padding:8px 28px 8px 10px;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;min-width:0}
#filter-button[aria-expanded=true],#filter-button.active{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.count[hidden]{display:none}.count{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:rgba(0,0,0,.18);font-size:11px;padding:0 5px}

/* Filter menu */
#filters{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 26px;box-shadow:var(--shadow)}
#filters[hidden]{display:none}
.row{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:10px;min-height:40px}
.row label{font-size:14px}
.row select,.row input{width:100%}
.row input{background:var(--field);border:1px solid var(--field-line);border-radius:9px;padding:8px 10px}
.row input::placeholder{color:var(--muted)}
.filters-foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:6px}

#status{color:var(--muted);font-size:12px;margin:12px 2px 0;min-height:16px}
#error{color:light-dark(#9a3428,#ffb4a6);background:var(--orange-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}

/* Result panels with a carousel of cards */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;margin-top:14px;box-shadow:var(--shadow)}
.panel h2{font-size:24px;letter-spacing:-.5px;margin:0 0 14px;font-weight:700}
.panel p.note{color:var(--muted);font-size:12px;margin:-6px 0 12px;line-height:1.5}
.carousel{position:relative}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,calc((100% - 32px)/3));gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 4px;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.nav{position:absolute;top:calc(var(--media-h,210px)/2 - 26px);width:52px;height:52px;border-radius:50%;border:0;background:#161618;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:2}
.nav svg.i{width:24px;height:24px;stroke-width:2.4}
.nav.prev{left:-10px}.nav.next{right:-10px}
.nav[hidden]{display:none}

.card{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.selected{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.media{position:relative;height:var(--media-h,210px);background:var(--well);display:grid;place-items:center;padding:16px;overflow:hidden}
.media img{width:100%;height:100%;object-fit:contain;min-height:0}
.media .missing{color:#555;font-size:12px}
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px 22px;opacity:0;pointer-events:none;transition:opacity .12s}
.card:hover .overlay,.card:focus-within .overlay,.card.open .overlay{opacity:1;pointer-events:auto}
.overlay .btn{width:100%;padding:11px 12px;font-size:14px;border-radius:11px;background:rgba(22,22,24,.82);border-color:rgba(255,255,255,.28);color:#fff}
.overlay .btn:hover{border-color:#fff}
.overlay .btn.orange{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.menu{display:none;gap:8px}
.menu.show{display:flex}
.menu .btn{flex:1}
.media.editing .overlay{display:none}
.composer{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:14px;z-index:1}
.composer textarea{width:100%;max-width:560px;margin:0 auto;height:min(118px,60%);resize:none;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(15,15,16,.9);color:#fff;padding:10px 12px;font-size:13.5px;line-height:1.45}
.composer textarea::placeholder{color:#c9c9cf}
.composer div{display:flex;gap:8px;justify-content:flex-end;width:100%;max-width:560px;margin:0 auto}
.composer .btn{background:rgba(22,22,24,.85);border-color:rgba(255,255,255,.3);color:#fff}
.composer .btn.orange{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.body{padding:14px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{font-size:18px;font-weight:700;line-height:1.25;margin:0;letter-spacing:-.2px;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--muted)}
details{font-size:12px;color:var(--muted)}
summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .12s}
details[open] summary::after{transform:rotate(225deg) translateY(-1px)}
.credit{display:flex;align-items:flex-start;gap:8px;margin-top:6px;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px}
.credit p{margin:0;flex:1;line-height:1.5;color:var(--ink);overflow-wrap:anywhere;user-select:text}
.credit .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--orange-soft);color:var(--orange-text);margin-bottom:4px}
.copy{flex:none;padding:5px 9px;font-size:12px;border-radius:7px}

/* A composed figure gets the whole panel width */
.figure-card{border-radius:16px}
.figure-card .media{height:auto;aspect-ratio:var(--ratio,4/3);max-height:560px;padding:10px;background:#fff}
.figure-card .media>svg{width:100%;height:100%;display:block}
.figure-card .overlay{padding:0 26%}
.figure-card .composer{padding:18px 20%}
.gaps{font-size:12px;color:var(--muted);line-height:1.5}

.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
footer{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5}

@media(hover:none){.overlay{position:static;opacity:1;pointer-events:auto;background:transparent;flex-direction:row;flex-wrap:wrap;padding:10px 12px 0}
  .overlay .btn{width:auto;flex:1;background:var(--field);border-color:var(--field-line);color:var(--ink);padding:8px;font-size:12.5px}
  .overlay .btn.orange{color:var(--orange-ink)}.figure-card .overlay{padding:10px 12px 0}}
@media(max-width:640px){main{padding:14px 12px}
  #search{flex-wrap:wrap}.field{flex-basis:100%}#filter-button,#search-button{flex:1}
  #filters{grid-template-columns:1fr}.row{grid-template-columns:100px minmax(0,1fr)}
  .track{grid-auto-columns:78%}.panel{padding:14px 12px;border-radius:14px}.panel h2{font-size:20px}
  .nav{display:none}.figure-card .overlay,.figure-card .composer{padding-left:14px;padding-right:14px}}
</style>
</head>
