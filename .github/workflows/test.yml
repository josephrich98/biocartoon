# Tests the catalog crate and the submissions Worker on every push.
name: test
on:
  push:
  pull_request:

jobs:
  submission:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: node --test scripts/check_mcp.test.mjs
      - name: Build and validate public submission draft
        run: python3 scripts/prepare_submission.py
      - name: Summarize readiness and review drift
        run: cat dist/submission/BUILD.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: biocartoon-submission-${{ github.sha }}
          path: dist/submission/
          if-no-files-found: error
          retention-days: 14

  plugin-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: catalog/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- dist/gallery.html
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python3 ../../scripts/package_plugin.py

  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: catalog
      - run: cargo test --release
      - run: cargo build --release --locked --bin biocartoon
      - run: python3 ../scripts/build_mcp_metadata.py
      - run: git diff --exit-code -- ../worker/generated/mcp-metadata.json

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: python3 -m unittest discover -s ../data -p test_mcp_catalog.py
