# `pip install biocartoon`: builds the command line (catalog/, see catalog/pyproject.toml) as a
# wheel for each platform, plus an sdist, and publishes them to PyPI for every v* tag. The tag must
# match catalog/Cargo.toml's version. Publishing uses PyPI trusted publishing (no token): the
# `biocartoon` project on PyPI trusts this repository's `pypi.yml` workflow in the `pypi`
# environment. Running the workflow by hand (Actions -> pypi -> Run workflow) builds the wheels as
# workflow artifacts and publishes nothing.
name: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          # ring (TLS) can't be cross-compiled by manylinux2014's old GCC for aarch64; 2_28 is glibc 2.28+.
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(grep -m1 '^version' catalog/Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag is $GITHUB_REF_NAME but catalog/Cargo.toml says $v"; exit 1; }
      # maturin-action pip-installs helpers, which Ubuntu's system Python refuses (PEP 668).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: catalog
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: catalog/dist/*
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The sdist runs `cargo metadata` on the runner itself (wheels build in containers that have Rust).
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: catalog
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: catalog/dist/*
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
